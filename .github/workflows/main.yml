name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show SDK versions
        run: flutter --version

      - name: Install dependencies
        run: |
          dart pub get
          dart pub get --directory example

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      # Only the root package's own sources; plugin/ is a separate package with
      # its own dependencies, analysed by the plugin workflow.
      - name: Analyse package
        run: dart analyze --fatal-infos lib 2>&1 | tee analyze-root.log

      - name: Analyse example
        run: dart analyze --fatal-infos example 2>&1 | tee analyze-example.log

      # The analyser already fails on unknown lints (undefined_lint), but
      # removed and deprecated rules are not always reported, so the check
      # below also reads the logs for the three diagnostics and guards the
      # latest versioned file against rules known to be removed in Dart 3.
      - name: Fail on undefined, removed or deprecated lints
        run: |
          if grep -E 'undefined_lint|removed_lint|deprecated_lint|included_file_warning' analyze-root.log analyze-example.log; then
            echo "Lint configuration references unknown, removed or deprecated rules." >&2
            exit 1
          fi
          latest=$(ls lib/analysis_options.*.*.*.yaml | sort -V | tail -n 1)
          removed='always_require_non_null_named_parameters|avoid_null_checks_in_equality_operators|avoid_private_typedef_functions|avoid_returning_null|avoid_returning_null_for_future|iterable_contains_unrelated_type|list_remove_unrelated_type|package_api_docs|prefer_equal_for_default_values|unnecessary_await_in_return'
          if grep -nE "^    - ($removed)\$" "$latest"; then
            echo "$latest lists rules removed or deprecated in Dart 3." >&2
            exit 1
          fi
